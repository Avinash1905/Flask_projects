<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="form-container">

    <h1>Login</h1>

    <form action="/login" method="POST">

        <input type="email"
               name="email"
               placeholder="Email">

        <input type="password"
               name="password"
               placeholder="Password">

        <button type="submit">

            Login

        </button>

    </form>

</div>

</body>

</html>
