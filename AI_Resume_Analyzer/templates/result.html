<!DOCTYPE html>
<html>

<head>

    <title>Analysis Result</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="navbar">

    Resume Analysis

</div>

<div class="result-container">

    <div class="result-card">

        <h2>ATS Score</h2>

        <h1>{{ score }}</h1>

    </div>

    <div class="result-card">

        <h2>Resume Summary</h2>

        <p>{{ summary }}</p>

    </div>

    <div class="result-card">

        <h2>Technical Skills</h2>

        <p>{{ skills }}</p>

    </div>

    <div class="result-card">

        <h2>Weak Areas</h2>

        <p>{{ weaknesses }}</p>

    </div>

    <div class="result-card">

        <h2>Suggestions</h2>

        <p>{{ suggestions }}</p>

    </div>

</div>

</body>

</html>
